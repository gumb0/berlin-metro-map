<style>
/* Layout: full-height app. Route panel on the left (desktop) or below the map (phone); the map fills the rest. */
:root {
  --bg: #f3f4f0;          /* map paper: light grey with a faint green cast */
  --surface: #ffffff;
  --fg: #16191d;
  --muted: #5d6670;
  --rule: #d8dcd6;
  --accent: #1d5fd1;      /* start marker */
  --dest: #d1361d;        /* destination marker */
  --station-fill: #ffffff;
  --halo: #f3f4f0;
  --water: #c3d8e8;
  --water-line: #9fc0da;
  --park: #dde7d3;
  --forest: #d3e0c8;
  --boundary: #c9cec4;
  --geo-label: #7d8a96;
  --font-ui: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-label: "Archivo Narrow", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --panel-w: 360px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121519; --surface: #1b1f24; --fg: #e9edf1; --muted: #9aa4ae; --rule: #2e353c;
    --accent: #6ea1ff; --dest: #ff7a5c; --station-fill: #121519; --halo: #121519;
    --water: #182a3a; --water-line: #24405a; --park: #18241b; --forest: #1a2a1d; --boundary: #2c3339; --geo-label: #6c7884;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121519; --surface: #1b1f24; --fg: #e9edf1; --muted: #9aa4ae; --rule: #2e353c;
  --accent: #6ea1ff; --dest: #ff7a5c; --station-fill: #121519; --halo: #121519;
  --water: #182a3a; --water-line: #24405a; --park: #18241b; --forest: #1a2a1d; --boundary: #2c3339; --geo-label: #6c7884;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); overflow: hidden; }
.app { height: 100%; display: grid; grid-template-columns: var(--panel-w) 1fr; }
.panel {
  background: var(--surface); border-right: 1px solid var(--rule);
  display: flex; flex-direction: column; gap: 16px; overflow-y: auto; min-width: 0;
  padding-block: 20px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px;
}
h1 { margin: 0; font-size: 1.35rem; font-weight: 700; letter-spacing: -0.01em; display: flex; align-items: center; gap: 10px; }
.ubadge { display: inline-grid; place-items: center; width: 1.6em; height: 1.6em; border-radius: 4px; background: #115d91; color: #fff; font-size: 0.8em; font-weight: 700; }
.ubadge + .ubadge { margin-left: -6px; }
.sbadge { background: #008d4f; border-radius: 50%; }
.hint { margin: 4px 0 0; color: var(--muted); font-size: 0.9rem; line-height: 1.45; }
.fields { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
.field { display: flex; align-items: center; gap: 8px; border: 1px solid var(--rule); border-radius: 6px; padding: 0 10px; background: var(--bg); }
.field:focus-within { border-color: var(--accent); }
.field .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.field input { border: 0; background: transparent; color: var(--fg); font: inherit; font-size: 0.95rem; padding: 10px 0; width: 100%; min-width: 0; outline: none; }
.stack { display: grid; gap: 8px; }
button { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--rule); border-radius: 6px; cursor: pointer; }
button:hover { border-color: var(--muted); }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.swap { width: 38px; height: 38px; font-size: 1.1rem; }
.clear { padding: 6px 12px; font-size: 0.85rem; justify-self: start; align-self: flex-start; }
.summary { display: flex; gap: 20px; align-items: baseline; border-top: 1px solid var(--rule); padding-top: 14px; }
.summary .big { font-size: 2rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.summary .small { color: var(--muted); font-size: 0.9rem; }
.legs { list-style: none; margin: 0; padding: 0; display: grid; }
.leg { display: grid; grid-template-columns: 44px 1fr; gap: 10px; padding: 10px 0; }
.leg .rail { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.lb.S { border-radius: 999px; }
.legend-row { display: flex; flex-wrap: wrap; gap: 4px; }
.lb { display: inline-grid; place-items: center; min-width: 34px; height: 22px; padding: 0 4px; border-radius: 3px; font-weight: 700; font-size: 0.85rem; }
.leg .bar { width: 4px; flex: 1; border-radius: 2px; min-height: 18px; }
.leg .body { min-width: 0; display: grid; gap: 3px; font-size: 0.92rem; }
.leg .st { font-weight: 600; }
.leg .meta { color: var(--muted); font-size: 0.85rem; font-variant-numeric: tabular-nums; }
.transfer { color: var(--muted); font-size: 0.85rem; padding: 6px 0 6px 54px; border-top: 1px dashed var(--rule); border-bottom: 1px dashed var(--rule); }
.note { color: var(--muted); font-size: 0.8rem; line-height: 1.45; margin: 0; }
.empty { color: var(--muted); font-size: 0.92rem; line-height: 1.5; margin: 0; }
.mapwrap { position: relative; min-width: 0; min-height: 0; }
svg#map { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
svg#map.panning { cursor: grabbing; }
.zoom { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); top: 12px; display: grid; gap: 6px; }
.zoom button { width: 38px; height: 38px; background: var(--surface); font-size: 1.15rem; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.legend { position: absolute; left: 12px; bottom: max(12px, env(safe-area-inset-bottom, 0px)); display: grid; gap: 4px; max-width: calc(100% - 24px); }
.attrib { background: var(--bg); padding: 2px 6px; border-radius: 3px; position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); bottom: max(10px, env(safe-area-inset-bottom, 0px)); font-size: 0.7rem; color: var(--muted); }

/* map */
.bg-water { fill: var(--water); stroke: none; }
.bg-river { fill: none; stroke: var(--water-line); stroke-linecap: round; stroke-linejoin: round; }
.bg-park { fill: var(--park); stroke: none; }
.bg-forest { fill: var(--forest); stroke: none; }
.bg-boundary { fill: none; stroke: var(--boundary); stroke-dasharray: 6 5; vector-effect: non-scaling-stroke; stroke-width: 1.5; }
.geo-lbl { font-family: var(--font-label); font-style: italic; fill: var(--geo-label); text-anchor: middle; pointer-events: none; }
.seg { fill: none; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; stroke-width: 4; }
.seg.S { stroke-width: 3.2; }
.walk { fill: none; stroke: var(--muted); stroke-width: 2; stroke-dasharray: 2 3; vector-effect: non-scaling-stroke; }
.route .seg, .route .seg.S { stroke-width: 7; }
.base-lines, .station, .lbl { transition: opacity .2s; }
svg.has-route .base-lines { opacity: .2; }
svg.has-route .station:not(.on-route), svg.has-route .lbl:not(.on-route) { opacity: .3; }
.st-dot { fill: var(--station-fill); vector-effect: non-scaling-stroke; stroke-width: 2; }
.st-x { fill: var(--station-fill); stroke: var(--fg); vector-effect: non-scaling-stroke; stroke-width: 2.2; }
.st-hit { fill: transparent; cursor: pointer; }
.labels { font-family: var(--font-label); }
.lbl { font-weight: 500; fill: var(--fg); paint-order: stroke; stroke: var(--halo); stroke-linejoin: round; cursor: pointer; }
.lbl.x { font-weight: 600; }
.lbl.on-route { font-weight: 600; }
.lbl.hover { fill: var(--accent); }
.station:hover .st-dot, .station:hover .st-x { stroke-width: 3; }
.marker circle { stroke: var(--station-fill); vector-effect: non-scaling-stroke; stroke-width: 2.5; }
.marker text { font-family: var(--font-ui); font-weight: 700; fill: #fff; text-anchor: middle; dominant-baseline: central; pointer-events: none; }

@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) auto; }
  .mapwrap { order: 1; }
  .panel { order: 2; border-right: 0; border-top: 1px solid var(--rule); max-height: 46vh; padding-block: 14px; gap: 12px;
    padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .hint { display: none; }
  h1 { font-size: 1.1rem; }
  .legend { display: none; }
}
@media (prefers-reduced-motion: reduce) { .base-lines, .station, .lbl { transition: none; } }
</style>

  </div>
</div>

  const r = svg.getBoundingClientRect(), aspect = (r.width || 1) / (r.height || 1);
  let w = b.w, h = b.h;
  if (w / h > aspect) h = w / aspect; else w = h * aspect;
  vb = { x: b.x + (b.w - w) / 2, y: b.y + (b.h - h) / 2, w, h }; applyVB();
}
function zoomAt(f, cx, cy) {
  const nw = Math.min(Math.max(vb.w * f, 1200), bounds.w * 2.5), k = nw / vb.w;
  vb = { x: cx - (cx - vb.x) * k, y: cy - (cy - vb.y) * k, w: vb.w * k, h: vb.h * k }; applyVB();
}
function toMap(cx, cy) {
  const r = svg.getBoundingClientRect();
  return [vb.x + (cx - r.left) / r.width * vb.w, vb.y + (cy - r.top) / r.height * vb.h];
}
svg.addEventListener("wheel", e => {
  e.preventDefault();
  const [x, y] = toMap(e.clientX, e.clientY);
  zoomAt(Math.exp(e.deltaY * (e.deltaMode ? 0.05 : 0.0015)), x, y);
}, { passive: false });
const pointers = new Map();
let dragMoved = false, pinch = null;
svg.addEventListener("pointerdown", e => {
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, x0: e.clientX, y0: e.clientY });
  if (pointers.size === 1) dragMoved = false;
  if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), w: vb.w }; }
});
svg.addEventListener("pointermove", e => {
  const p = pointers.get(e.pointerId); if (!p) return;
  const r = svg.getBoundingClientRect();
  if (pointers.size === 1) {
    if (!dragMoved && Math.hypot(e.clientX - p.x0, e.clientY - p.y0) > 6) { dragMoved = true; svg.classList.add("panning"); svg.setPointerCapture(e.pointerId); }
    if (dragMoved) { vb.x -= (e.clientX - p.x) / r.width * vb.w; vb.y -= (e.clientY - p.y) / r.height * vb.h; applyVB(); }
  } else if (pointers.size === 2 && pinch) {
    dragMoved = true; p.x = e.clientX; p.y = e.clientY;
    const [a, b] = [...pointers.values()], d = Math.hypot(a.x - b.x, a.y - b.y);
    const [cx, cy] = toMap((a.x + b.x) / 2, (a.y + b.y) / 2);
    zoomAt((pinch.w * pinch.d / d) / vb.w, cx, cy);
    return;
  }
  p.x = e.clientX; p.y = e.clientY;
});
function endPointer(e) { pointers.delete(e.pointerId); if (pointers.size < 2) pinch = null; if (!pointers.size) svg.classList.remove("panning"); }
svg.addEventListener("pointerup", endPointer);
svg.addEventListener("pointercancel", endPointer);
document.getElementById("zin").onclick = () => zoomAt(1 / 1.5, vb.x + vb.w / 2, vb.y + vb.h / 2);
document.getElementById("zout").onclick = () => zoomAt(1.5, vb.x + vb.w / 2, vb.y + vb.h / 2);
document.getElementById("zfit").onclick = () => fitTo(bounds);

/* ---------- selection & route display ---------- */
const state = { from: null, to: null, route: null };
const fromIn = document.getElementById("from"), toIn = document.getElementById("to");
const resultEl = document.getElementById("result");
const nameAt = e => { const g = e.target.closest("[data-name]"); return g ? g.getAttribute("data-name") : null; };
svg.addEventListener("click", e => { if (!dragMoved) { const n = nameAt(e); if (n) pick(n); } });
svg.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.classList.contains("station")) { e.preventDefault(); pick(e.target.dataset.name); }
});
svg.addEventListener("pointerover", e => {
  const n = nameAt(e);
  for (const st of stations.values()) st.label.classList.toggle("hover", st.name === n);
});
function pick(name) {
  if (!state.from || state.to) { state.from = name; state.to = null; }
  else if (name === state.from) state.from = null;
  else state.to = name;
  update(true);
}
function fromInput(input, key) {
  const v = input.value.trim().toLowerCase();
  const match = [...stations.keys()].find(n => n.toLowerCase() === v);
  if (match) { state[key] = match; update(true); }
  else if (!v) { state[key] = null; update(false); }
}
fromIn.addEventListener("change", () => fromInput(fromIn, "from"));
toIn.addEventListener("change", () => fromInput(toIn, "to"));
document.getElementById("swap").onclick = () => { [state.from, state.to] = [state.to, state.from]; update(true); };
const dl = document.getElementById("station-list");
[...stations.keys()].sort((a, b) => a.localeCompare(b, "de")).forEach(n => { const o = document.createElement("option"); o.value = n; dl.appendChild(o); });
const badge = id => { const l = lineById[id]; return `<span class="lb ${l.mode}" style="background:${l.color};color:${l.text}">${id}</span>`; };
document.getElementById("legend").innerHTML = ["U", "S"].map(m =>
  `<div class="legend-row">${lines.filter(l => l.mode === m).map(l => badge(l.id)).join("")}</div>`).join("");
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmtMin = m => Math.round(m) + " min";

function routeBounds() {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  [state.from, state.to, ...state.route.legs.flatMap(g => g.stops)].forEach(n => { const s = stations.get(n); x0 = Math.min(x0, s.x); y0 = Math.min(y0, s.y); x1 = Math.max(x1, s.x); y1 = Math.max(y1, s.y); });
  const w = Math.max(x1 - x0, 2500) * 1.35, h = Math.max(y1 - y0, 2000) * 1.35;
  return { x: (x0 + x1) / 2 - w / 2, y: (y0 + y1) / 2 - h / 2, w, h };
}
function drawMarkers(s) {
  markerLayer.replaceChildren();
  const cs = getComputedStyle(document.documentElement);
  const mark = (name, color, letter) => {
    if (!name) return;
    const st = stations.get(name), g = el("g", { class: "marker" }, markerLayer);
    el("circle", { cx: st.x, cy: st.y, r: 8.5 * s, fill: color }, g);
    el("text", { x: st.x, y: st.y + 0.5 * s, "font-size": 10 * s }, g).textContent = letter;
  };
  mark(state.from, cs.getPropertyValue("--accent").trim(), "A");
  mark(state.to, cs.getPropertyValue("--dest").trim(), "B");
}

function update(refit) {
  fromIn.value = state.from || ""; toIn.value = state.to || "";
  state.route = state.from && state.to ? findRoute(state.from, state.to) : null;
  routeLayer.replaceChildren();
  svg.classList.toggle("has-route", !!state.route);
  const onRoute = new Set();
  if (state.route) for (const g of state.route.legs) {
    const l = lineById[g.line];
    for (let i = 1; i < g.stops.length; i++) {
      const s = l.segs.find(s => segKey(s.a, s.b) === segKey(g.stops[i - 1], g.stops[i]));
      el("path", { class: "seg " + l.mode, d: pathD(s.pts), stroke: l.color }, routeLayer);
    }
    g.stops.forEach(n => onRoute.add(n));
  }
  if (state.route) { onRoute.add(state.from); onRoute.add(state.to); }
  for (const st of stations.values()) {
    st.g.classList.toggle("on-route", onRoute.has(st.name));
    st.label.classList.toggle("on-route", onRoute.has(st.name));
  }
  renderPanel();
  if (refit && state.route) fitTo(routeBounds());
  scheduleLayout();
}

function renderPanel() {
  const r = state.route;
  if (!r) {
    resultEl.innerHTML = state.from
      ? `<p class="empty">Start: <strong>${esc(state.from)}</strong>. Now click your destination on the map.</p>`
      : `<p class="empty">No route yet. Click any station on the map to begin, or type a station name above.</p>`;
    return;
  }
  let html = `<div class="summary"><div><div class="big">${fmtMin(r.total)}</div><div class="small">travel time</div></div>
    <div class="small">${r.stops} stops<br>${r.transfers === 0 ? "no changes" : r.transfers === 1 ? "1 change" : r.transfers + " changes"}</div></div>
    <ul class="legs">`;
  if (r.walkStart) html += `<li class="transfer">Walk from ${esc(r.from)} to ${esc(r.legs[0].stops[0])} · about ${fmtMin(r.walkStart)}</li>`;
  r.legs.forEach((g, i) => {
    const a = g.stops[0], b = g.stops[g.stops.length - 1];
    if (i > 0) html += g.walkFrom
      ? `<li class="transfer">Walk from ${esc(g.walkFrom)} to ${esc(a)} · about ${fmtMin(g.change)} incl. waiting</li>`
      : `<li class="transfer">Change at ${esc(a)} · about ${fmtMin(g.change)} incl. waiting</li>`;
    const dirs = [g.line, ...g.alts].map(id => `${badge(id)} ${esc(direction(id, a, b))}`).join("<br>or ");
    html += `<li class="leg"><div class="rail">${badge(g.line)}<span class="bar" style="background:${lineById[g.line].color}"></span></div>
      <div class="body"><span class="st">${esc(a)}</span><span class="meta">${dirs}</span>
      <span class="meta">${g.stops.length - 1} ${g.stops.length === 2 ? "stop" : "stops"} · ${fmtMin(g.minutes)}</span>
      <span class="st">${esc(b)}</span></div></li>`;
  });
  if (r.walkEnd) html += `<li class="transfer">Walk from ${esc(r.legs.length ? r.legs.at(-1).stops.at(-1) : r.from)} to ${esc(r.to)} · about ${fmtMin(r.walkEnd)}</li>`;
  html += `</ul><button class="clear" id="clear">Clear route</button>
    <p class="note">Ride times come from the VBB weekday timetable. A change counts ${WALK_SAME_MODE_MIN} min walking (${WALK_U_S_MIN} min between U-Bahn and S-Bahn) plus half the interval of the next line at that station. Waiting for the first train is not included.</p>`;
  resultEl.innerHTML = html;
  document.getElementById("clear").onclick = () => { state.from = state.to = null; update(false); fitTo(core); };
}

new ResizeObserver(() => fitTo(state.route ? routeBounds() : core)).observe(svg);
measureLabels();
state.from = "Kleistpark"; state.to = "Flughafen BER";
fitTo(core);
update(true);
document.fonts && document.fonts.ready.then(() => { measureLabels(); relayout(); });
</script>
